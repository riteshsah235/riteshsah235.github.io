name: Organize project folders (one-off)
on:
  push:
    paths:
      - ".github/workflows/reorganize.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  organize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move files and fix paths
        run: |
          set -e
          if [ ! -f style.css ]; then echo "already organized"; exit 0; fi
          mkdir -p assets/css assets/js assets/images data scripts
          git mv style.css assets/css/style.css
          git mv app.js assets/js/app.js
          git mv cs-arena.jpg bomb-tag.jpg nexuslife.jpg assets/images/
          git mv contrib.json data/contrib.json
          git mv update_contrib.py scripts/update_contrib.py
          sed -i 's#href="style.css"#href="assets/css/style.css"#' index.html
          sed -i 's#src="app.js"#src="assets/js/app.js"#' index.html
          sed -i -E 's#src="(cs-arena|bomb-tag|nexuslife)\.jpg"#src="assets/images/\1.jpg"#' index.html
          sed -i "s#fetch('contrib.json'#fetch('data/contrib.json'#" assets/js/app.js
          sed -i "s#open('contrib.json','w')#open('data/contrib.json','w')#" scripts/update_contrib.py
          touch .nojekyll
          grep -c 'assets/' index.html
          grep -n "data/contrib.json" assets/js/app.js scripts/update_contrib.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Organize project into assets, data and scripts folders"
          git push
